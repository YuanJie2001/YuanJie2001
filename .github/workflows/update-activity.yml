name: Update Activity Chart
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点（北京时间早8点）自动运行
  workflow_dispatch: # 允许你在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限来提交生成的 SVG 文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: ${{ github.repository_owner }} # 自动获取你的用户名
          token: ${{ github.token }} # 使用内置 Token，无需手动创建
          default-days: '30'
          ranges: '30,90,365' # 同时生成30、90、365天三种范围的图表

      - name: Commit and push charts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update activity charts [skip ci]'
          file_pattern: 'activity-*.svg' # 只提交生成的 SVG 文件
